<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 70">
  <defs>
    <linearGradient id="mp5sd-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C8D0D8"/>
      <stop offset="100%" stop-color="#8890A0"/>
    </linearGradient>
  </defs>
  <!-- MP5-SD: integrated suppressor + straight mag + fixed stock -->
  <g fill="url(#mp5sd-grad)">
    <!-- Integrated suppressor (long cylinder) -->
    <rect x="2" y="26" width="42" height="8" rx="3"/>
    <!-- Suppressor end cap -->
    <rect x="2" y="24" width="4" height="12" rx="1.5"/>
    <!-- Barrel (inside) -->
    <rect x="28" y="28" width="18" height="4" rx="1.5"/>
    <!-- Receiver -->
    <rect x="44" y="22" width="48" height="16" rx="3"/>
    <!-- Magazine (straight) -->
    <rect x="60" y="38" width="9" height="24" rx="2"/>
    <!-- Pistol grip -->
    <rect x="82" y="38" width="9" height="22" rx="3" transform="rotate(10, 82, 38)"/>
    <!-- Fixed stock -->
    <rect x="90" y="24" width="48" height="9" rx="3"/>
    <rect x="136" y="22" width="6" height="18" rx="2"/>
    <!-- Top rail -->
    <rect x="52" y="18" width="34" height="4" rx="1"/>
    <!-- Front sight -->
    <rect x="32" y="18" width="5" height="6" rx="1"/>
    <!-- Trigger guard -->
    <path d="M74 38 Q76 48 80 49 Q84 49 86 44 L86 38Z" opacity="0.9"/>
    <!-- Charging handle -->
    <rect x="70" y="12" width="4" height="8" rx="1" opacity="0.8"/>
  </g>
</svg>
